<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PdfX - Futuristic Merge</title>
<link rel="icon" href="/static/PDF-icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Orbitron',sans-serif;
  background:radial-gradient(circle at top,#0f0c29,#000 60%);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
}
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(0,255,255,0.08)1px,transparent 1px);
  background-size:40px 40px;
  animation:moveBg 20s linear infinite;
  pointer-events:none;
  z-index:-1;
}
@keyframes moveBg{
  from{transform:translate(0,0)}
  to{transform:translate(-200px,-200px)}
}
.card{
  position:relative;
  width:700px;
  padding:40px;
  border-radius:20px;
  background:rgba(20,20,30,0.8);
  backdrop-filter:blur(15px);
  box-shadow:0 0 25px #8a2be2;
}
h1{
  text-align:center;
  color:#00f5ff;
  margin-bottom:5px;
}
.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:30px;
}
.upload-box{
  border:2px dashed #8a2be2;
  padding:30px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
}
.upload-box:hover{
  background:rgba(138,43,226,.1);
  box-shadow:0 0 15px #8a2be2;
}
.file-list{
  margin-top:15px;
}
.file-item{
  display:flex;
  justify-content:space-between;
  background:rgba(255,255,255,.05);
  padding:8px 12px;
  border-radius:8px;
  margin-bottom:6px;
}
.remove{
  color:#ff4d6d;
  cursor:pointer;
}
.btn-merge{
  margin-top:20px;
  padding:12px 40px;
  border:none;
  border-radius:50px;
  background:linear-gradient(90deg,#00f5ff,#8a2be2);
  color:black;
  font-weight:700;
  cursor:pointer;
}
.progress-container{
  margin-top:15px;
  height:8px;
  background:#222;
  border-radius:50px;
  overflow:hidden;
  display:none;
}
.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f5ff,#ff00ff);
  transition:.2s;
}
table{
  width:100%;
  margin-top:30px;
  font-size:14px;
}
th,td{
  padding:8px;
  text-align:left;
}
.success-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.success-box{
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px #00f5ff;
}
.success-box a, .success-box button{
  display:inline-block;
  margin-top:15px;
  padding:10px 25px;
  border-radius:30px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.success-box a{background:#00f5ff;color:black}
.success-box button{background:#ff4d6d;color:white}
</style>
</head>
<body>

<div class="card">
<h1>PdfX</h1>
<p class="sub">Cyber PDF Merge Engine</p>

<form id="mergeForm">
<div class="upload-box" id="dropArea">
Drop PDFs here or click to upload
<input type="file" id="fileInput" multiple accept=".pdf" hidden>
</div>

<div class="file-list" id="fileList"></div>

<div class="progress-container" id="progressContainer">
<div class="progress-bar" id="progressBar"></div>
</div>

<button class="btn-merge">MERGE NOW</button>
</form>

<h3 style="margin-top:30px">Merge History</h3>
<table>
<thead>
<tr><th>File</th><th>Date</th><th>Action</th></tr>
</thead>
<tbody id="historyBody"></tbody>
</table>
</div>

<div class="success-modal" id="successModal">
<div class="success-box">
<h2 style="color:#00f5ff">✔ Merge Complete</h2>
<a id="downloadBtn">Download</a>
<button id="deleteBtn">Delete</button>
</div>
</div>

<script>
const dropArea=document.getElementById("dropArea");
const fileInput=document.getElementById("fileInput");
const fileList=document.getElementById("fileList");
const form=document.getElementById("mergeForm");
const progressBar=document.getElementById("progressBar");
const progressContainer=document.getElementById("progressContainer");
const successModal=document.getElementById("successModal");
const downloadBtn=document.getElementById("downloadBtn");
const deleteBtn=document.getElementById("deleteBtn");
const historyBody=document.getElementById("historyBody");

let selectedFiles=[];
let currentFile="";

dropArea.onclick=()=>fileInput.click();
fileInput.onchange=()=>{selectedFiles=[...fileInput.files];renderFiles()};
dropArea.ondragover=e=>e.preventDefault();
dropArea.ondrop=e=>{
e.preventDefault();
selectedFiles=[...e.dataTransfer.files];
renderFiles();
};

function renderFiles(){
fileList.innerHTML="";
selectedFiles.forEach((file,i)=>{
fileList.innerHTML+=`
<div class="file-item">
${file.name}
<span class="remove" onclick="removeFile(${i})">✖</span>
</div>`;
});
}
function removeFile(i){
selectedFiles.splice(i,1);
renderFiles();
}

form.onsubmit=e=>{
e.preventDefault();
if(selectedFiles.length<2)return alert("Upload at least 2 PDFs");

const formData=new FormData();
selectedFiles.forEach(f=>formData.append("pdfs",f));

const xhr=new XMLHttpRequest();
xhr.open("POST","/merge",true);

progressContainer.style.display="block";

xhr.upload.onprogress=e=>{
if(e.lengthComputable){
progressBar.style.width=(e.loaded/e.total)*100+"%";
}
};

xhr.onload=()=>{
const res=JSON.parse(xhr.responseText);
currentFile=res.file;
downloadBtn.href="/download/"+res.file;
successModal.style.display="flex";

historyBody.innerHTML+=`
<tr>
<td>${res.file}</td>
<td>${new Date().toLocaleString()}</td>
<td><a href="/download/${res.file}" style="color:#00f5ff">Download</a></td>
</tr>`;
};

xhr.send(formData);
};

successModal.onclick=e=>{
if(e.target===successModal)successModal.style.display="none";
};

deleteBtn.onclick=async()=>{
await fetch("/delete/"+currentFile,{method:"DELETE"});
successModal.style.display="none";
};
</script>

</body>
</html>
